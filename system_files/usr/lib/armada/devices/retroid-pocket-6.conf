ARMADA_DEVICE_ID=retroid-pocket-6
ARMADA_DEVICE_NAME='Retroid Pocket 6'
ARMADA_SOC_CLASS=SM8550

ARMADA_PANEL_ORIENTATION=left

# Default to deep suspend (PSCI S2R). The RP6's SM8550 charges in deep with the
# battmgr client-side wakeup kernel patches; deep gives the lowest on-battery
# drain. Overridable via /etc/armada/sleep.conf (suspend_mode=fake|s2idle|deep).
# The RP6 is the fleet's validated deep model; deep as the default implies
# validation (see device-env's fleet gate), so no separate flag is needed here.
ARMADA_SUSPEND_MODE=deep

# Armada Control's top-bar power-profile glyph, tuned on this panel.
ARMADA_UI_TOPBAR_INDICATOR_SIZE_PX=16
ARMADA_UI_TOPBAR_INDICATOR_MARGIN_PX=6

# The stick LEDs read about 12% brighter than the panel at the same backlight
# level; armada-rgb scales them down when following the screen brightness.
ARMADA_RGB_SYNC_SCALE=0.88
